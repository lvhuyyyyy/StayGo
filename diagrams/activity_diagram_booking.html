<!DOCTYPE html>

<title>Biểu đồ Hoạt động - Quy trình đặt phòng</title>
<style>

  h3   { text-align: center; font-size: 15px; margin-bottom: 4px; }

<body>
<h3>Hình 2.2. Biểu đồ hoạt động quy trình đặt phòng – StayGo</h3>
<p class="note">Nguồn: Tác giả</p>

<svg width="820" height="1280" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#374151"/>
  </marker>

  <filter id="shadow" x="-5%" y="-5%" width="115%" height="130%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
  </filter>

<!-- ===== SWIMLANE HEADERS ===== -->
<rect x="10"  y="10" width="395" height="38" fill="#1d4ed8" rx="6"/>
<text x="207" y="34" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Người dùng (User)</text>

<rect x="415" y="10" width="395" height="38" fill="#b91c1c" rx="6"/>
<text x="612" y="34" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Hệ thống (System)</text>

<!-- Swimlane background -->
<rect x="10"  y="48" width="395" height="1215" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" rx="0"/>
<rect x="415" y="48" width="395" height="1215" fill="#fff1f2" stroke="#fecaca" stroke-width="1" rx="0"/>

<!-- Center divider -->
<line x1="412" y1="48" x2="412" y2="1263" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>

<!-- ===== HELPER: activity boxes, diamonds, etc. ===== -->

<!-- START -->
<circle cx="207" cy="88" r="16" fill="#1f2937"/>
<text x="207" y="116" text-anchor="middle" font-size="11" fill="#1f2937">Bắt đầu</text>
<line x1="207" y1="104" x2="207" y2="130" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ACT 1: Truy cập trang chi tiết KS -->
<rect x="87" y="132" width="240" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
<text x="207" y="155" text-anchor="middle" font-size="12" fill="#1e3a8a">Truy cập trang chi tiết KS</text>
<line x1="207" y1="168" x2="207" y2="192" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ACT 2: Chọn loại phòng -->
<rect x="87" y="194" width="240" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
<text x="207" y="217" text-anchor="middle" font-size="12" fill="#1e3a8a">Chọn loại phòng mong muốn</text>
<line x1="207" y1="230" x2="207" y2="254" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- DECISION 1: Đã đăng nhập? -->
<polygon points="207,256 275,296 207,336 139,296" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
<text x="207" y="292" text-anchor="middle" font-size="12" fill="#713f12">Đã đăng</text>
<text x="207" y="307" text-anchor="middle" font-size="12" fill="#713f12">nhập?</text>

<!-- NO branch -->
<line x1="139" y1="296" x2="80" y2="296" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="108" y="288" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">Chưa</text>

<!-- ACT Login (left detour) -->

<text x="49" y="299" text-anchor="middle" font-size="10" fill="#78350f">Đăng nhập</text>
<text x="49" y="311" text-anchor="middle" font-size="10" fill="#78350f">/ Đăng ký</text>

<!-- Login back to flow -->
<line x1="49" y1="314" x2="49" y2="390" stroke="#374151" stroke-width="1.5"/>
<line x1="49" y1="390" x2="160" y2="390" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- YES branch -->

<text x="220" y="352" text-anchor="start" font-size="11" fill="#16a34a" font-weight="bold">Rồi</text>

<!-- ACT 3: Điền thông tin -->

<text x="207" y="385" text-anchor="middle" font-size="12" fill="#1e3a8a">Điền thông tin đặt phòng</text>
<text x="207" y="399" text-anchor="middle" font-size="10" fill="#3b82f6">(họ tên, SĐT, ngày nhận/trả)</text>

<!-- connector under ACT3 down -->
<line x1="207" y1="400" x2="207" y2="424" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ACT 4: Chọn PTTT -->

<line x1="207" y1="462" x2="207" y2="486" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- DECISION 2: PTTT -->
<polygon points="207,488 285,524 207,560 129,524" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
<text x="207" y="520" text-anchor="middle" font-size="11" fill="#713f12">Phương thức</text>
<text x="207" y="534" text-anchor="middle" font-size="11" fill="#713f12">thanh toán?</text>

<!-- 5 branches -->
<!-- bank/momo/card → system left column -->
<line x1="129" y1="524" x2="460" y2="490" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="290" y="498" font-size="10" fill="#475569">bank/momo/card</text>

<!-- vnpay → system -->
<line x1="207" y1="560" x2="460" y2="560" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="220" y="554" font-size="10" fill="#475569">vnpay</text>

<!-- hotel → system -->
<line x1="285" y1="524" x2="460" y2="580" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="338" y="546" font-size="10" fill="#475569">hotel</text>

<!-- ===== SYSTEM COLUMN – payment handling ===== -->

<!-- SYS ACT A: Hiển thị QR / hướng dẫn (bank/momo/card) -->
<rect x="462" y="465" width="260" height="38" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
<text x="592" y="487" text-anchor="middle" font-size="12" fill="#7f1d1d">Hiển thị QR / hướng dẫn</text>
<text x="592" y="500" text-anchor="middle" font-size="10" fill="#b91c1c">(bank · MoMo · thẻ quốc tế)</text>

<!-- SYS ACT B: Chuyển VNPay -->
<rect x="462" y="543" width="260" height="36" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
<text x="592" y="566" text-anchor="middle" font-size="12" fill="#7f1d1d">Chuyển đến cổng VNPay</text>

<!-- SYS ACT C: Ghi nhận hotel -->
<rect x="462" y="563" width="260" height="36" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
<text x="592" y="586" text-anchor="middle" font-size="12" fill="#7f1d1d">Ghi nhận: thanh toán tại KS</text>

<!-- Merge 3 branches to single flow -->
<line x1="592" y1="503" x2="592" y2="630" stroke="#374151" stroke-width="1.3"/>
<line x1="592" y1="579" x2="620" y2="579"/>
<line x1="592" y1="599" x2="620" y2="599"/>
<line x1="592" y1="630" x2="207" y2="630" stroke="#374151" stroke-width="1.5"/>
<line x1="207" y1="630" x2="207" y2="655" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ACT 5: Nhấn Xác nhận đặt phòng -->
<rect x="87" y="657" width="240" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
<text x="207" y="680" text-anchor="middle" font-size="12" fill="#1e3a8a">Nhấn "Xác nhận đặt phòng"</text>
<line x1="327" y1="675" x2="462" y2="675" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- SYS ACT D: Kiểm tra dữ liệu -->
<rect x="462" y="657" width="260" height="36" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
<text x="592" y="680" text-anchor="middle" font-size="12" fill="#7f1d1d">Kiểm tra &amp; xác thực dữ liệu</text>
<line x1="592" y1="693" x2="592" y2="717" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- DECISION 3: Hợp lệ? (in system lane) -->
<polygon points="592,719 660,755 592,791 524,755" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
<text x="592" y="751" text-anchor="middle" font-size="11" fill="#713f12">Dữ liệu</text>
<text x="592" y="765" text-anchor="middle" font-size="11" fill="#713f12">hợp lệ?</text>

<line x1="524" y1="755" x2="462" y2="755" stroke="#374151" stroke-width="1.5"/>
<line x1="462" y1="755" x2="207" y2="755" stroke="#374151" stroke-width="1.5"/>
<line x1="207" y1="755" x2="207" y2="697" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="345" y="748" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">Không hợp lệ</text>

<!-- Invalid label on right side -->
<rect x="462" y="786" width="120" height="24" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="1"/>
<text x="522" y="803" text-anchor="middle" font-size="10" fill="#9a3412">Hiển thị lỗi</text>
<line x1="524" y1="755" x2="522" y2="786" stroke="#f97316" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="522" y1="810" x2="522" y2="830" stroke="#f97316" stroke-width="1.3"/>
<line x1="522" y1="830" x2="207" y2="830" stroke="#f97316" stroke-width="1.3"/>
<line x1="207" y1="830" x2="207" y2="697" stroke="#f97316" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)"/>

<!-- Valid branch ↓ -->
<line x1="592" y1="791" x2="592" y2="815" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="608" y="808" text-anchor="start" font-size="11" fill="#16a34a" font-weight="bold">Hợp lệ</text>

<!-- SYS ACT E: Tạo mã đơn -->
<rect x="462" y="817" width="260" height="36" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
<text x="592" y="840" text-anchor="middle" font-size="12" fill="#7f1d1d">Tạo mã đơn (ORD…)</text>
<line x1="592" y1="853" x2="592" y2="877" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- SYS ACT F: Lưu DB -->
<rect x="462" y="879" width="260" height="36" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
<text x="592" y="902" text-anchor="middle" font-size="12" fill="#7f1d1d">Lưu vào cơ sở dữ liệu</text>
<line x1="592" y1="915" x2="592" y2="939" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- SYS ACT G: Cập nhật trạng thái -->
<rect x="462" y="941" width="260" height="36" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
<text x="592" y="961" text-anchor="middle" font-size="12" fill="#7f1d1d">Cập nhật trạng thái: Chờ xác nhận</text>
<line x1="592" y1="977" x2="592" y2="1001" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- SYS ACT H: Trả kết quả → User -->
<rect x="462" y="1003" width="260" height="36" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
<text x="592" y="1026" text-anchor="middle" font-size="12" fill="#7f1d1d">Trả kết quả xác nhận</text>
<line x1="462" y1="1021" x2="327" y2="1021" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ACT 6: Hiển thị xác nhận thành công (User) -->
<rect x="87" y="1003" width="240" height="36" rx="18" fill="#d1fae5" stroke="#059669" stroke-width="1.8" filter="url(#shadow)"/>
<text x="207" y="1026" text-anchor="middle" font-size="12" fill="#065f46">Hiển thị xác nhận thành công</text>
<text x="207" y="1040" text-anchor="middle" font-size="10" fill="#059669">(Mã đơn ORD… + chi tiết đặt phòng)</text>
<line x1="207" y1="1041" x2="207" y2="1065" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

<rect x="87" y="1067" width="240" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>

<line x1="207" y1="1103" x2="207" y2="1127" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
